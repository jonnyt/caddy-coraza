---

name: Create and publish container image

on:
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
  schedule:
    - cron: '25 17 * * 2'  # Weekly update

env:
  IMAGE_NAME: caddy-coraza
  BASE_IMAGE_DOCKERFILE: ./Dockerfile
  DOCKERHUB_USERNAME: jonathont

jobs:

  check:
    runs-on: ubuntu-latest

    outputs:
      differs: ${{ steps.check.outputs.differs }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set base image
        run: |
          echo "BASE_IMAGE=$(grep -E 'FROM.+AS\s+caddy-coraza' ./Dockerfile | awk '{print $2}')" >> "$GITHUB_ENV"

      - name: Debug
        run: |
          echo ${{ env.BASE_IMAGE }}

      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
        if: ${{ github.event_name == 'schedule' }}

      - name: Check if update available
        id: check
        uses: ClementTsang/docker-check-base-image-diff@532795523039171ee8e94cce949a28e4059efaae
        with:
          base-image: docker://${{ env.BASE_IMAGE }}
          derived-image: docker://${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
        if: ${{ github.event_name == 'schedule' }}

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    # When invoked by schedule, only build if the base image is out of date
    if: ${{ needs.check.outputs.differs == 'true' || github.event_name != 'schedule' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to the Dockerhub registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Extract metadata (tags, labels) for container
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      - name: Build and push container image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
